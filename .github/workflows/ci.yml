name: CI/CD - democyber

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        # v2 (Node 20) ne fonctionne plus depuis le retrait de Node 20 des runners GitHub
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-deploy:
    needs: secret-scan
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile Java
        run: mvn -B compile

      - name: Build Java project with Maven
        run: mvn -B clean package

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t "$DOCKER_IMAGE_NAME" .

      - name: Test Docker image locally
        run: |
          docker run -d -p 8080:8080 --name democyber-ci "$DOCKER_IMAGE_NAME"
          EXPECTED="Bonjour depuis democyber Spring Boot !"
          for i in $(seq 1 30); do
            RESPONSE=$(curl -s http://localhost:8080 || true)
            if [ "$RESPONSE" = "$EXPECTED" ]; then
              echo "OK : $RESPONSE"
              docker stop democyber-ci
              exit 0
            fi
            sleep 2
          done
          echo "Reponse inattendue : '$RESPONSE'"
          docker logs democyber-ci
          docker stop democyber-ci
          exit 1

      - name: Push Docker image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$DOCKER_IMAGE_NAME"
