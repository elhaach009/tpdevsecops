spring.application.name=democyber
server.port=8080

# Supervision (TP4) : Actuator + Micrometer/Prometheus
# ATTENTION : include=* expose TOUS les endpoints (env, heapdump, ...) -> TP uniquement,
# en production limiter a health,info,prometheus (voir COMPTE_RENDU_TP4.md)
management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
# Label "application" utilise par le dashboard Grafana 11378 (JVM Micrometer)
management.metrics.tags.application=${spring.application.name}
