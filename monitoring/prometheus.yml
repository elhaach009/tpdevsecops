global:
  scrape_interval: 5s

scrape_configs:
  # Prometheus se supervise lui-meme
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Application Spring Boot democyber (Actuator + Micrometer)
  - job_name: "democyber"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
